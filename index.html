<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/budget-tracker-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Budget Tracker</title>
    <script>
      (function () {
        var storedTheme = localStorage.getItem('theme-preference');
        var theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : 'dark';
        document.documentElement.setAttribute('data-bs-theme', theme);

        var storedBrand = localStorage.getItem('brand-name-preference');
        if (storedBrand && storedBrand.trim()) {
          document.title = storedBrand;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
