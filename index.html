<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/budget-tracker-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Budget Tracker</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme-preference');
        var theme = stored === 'light' || stored === 'dark' ? stored: 'dark'; document.documentElement.setAttribute('data-bs-theme', theme)
      }) ();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
